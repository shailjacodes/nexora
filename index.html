<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora - KIIT University Event Management Platform | Bhubaneswar</title>
    <meta name="description" content="Responsive event management and ticketing platform for KIIT University, Bhubaneswar. Explore campus fests, conferences, and cricket tournaments, sign in with student credentials, and register with UPI & smart card payment tracking." />
    <meta property="og:title" content="Nexora - KIIT University Event Management Platform | Bhubaneswar" />
    <meta property="og:description" content="Explore KIIT Fest, ICDCIT, KPL Cricket, and E-Summit across KIIT Campuses in Bhubaneswar with instant digital pass generation and payment tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Compatibility shim for browser extensions and inspector tools that wrap window.fetch
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('nexora_theme_preference_v1');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
